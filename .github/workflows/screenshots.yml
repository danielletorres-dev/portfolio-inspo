name: Website screenshots
on:
  push:
    paths: ["links.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: screenshots
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/screenshots.mjs
      - name: Save new screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git diff --cached --quiet || (git commit -m "Add website screenshots" && git push)
